apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corebazaar-api
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
        - api.example.com
      secretName: corebazaar-api-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corebazaar-storefront
                port:
                  number: 80
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corebazaar-api
                port:
                  number: 80
