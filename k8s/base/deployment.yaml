apiVersion: apps/v1
kind: Deployment
metadata:
  name: corebazaar-api
  labels:
    app.kubernetes.io/name: corebazaar-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: corebazaar-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corebazaar-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/corebazaar-api:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: corebazaar-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corebazaar-api-secrets
                  key: database-url
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
